name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 neovim

      - name: Install plenary.nvim
        run: git clone --depth=1 https://github.com/nvim-lua/plenary.nvim deps/plenary.nvim

      - name: Check Lua syntax
        run: luac5.4 -p lua/mini/codex.lua plugin/codex.lua tests/minimal_init.lua tests/codex_spec.lua

      - name: Run tests
        run: >-
          nvim --clean --headless -u tests/minimal_init.lua
          -c 'PlenaryBustedFile tests/codex_spec.lua'

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
