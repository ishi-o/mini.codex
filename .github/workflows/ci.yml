name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.0
  PLENARY_REV: 74b06c6c75e4eeb3108ec01852001636d85a932b

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache test dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/nvim
            deps/plenary.nvim
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ env.NVIM_VERSION }}-${{ env.PLENARY_REV }}

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4

      - name: Install Neovim
        run: |
          if [ ! -x "$HOME/.local/nvim/bin/nvim" ]; then
            curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" | tar -xz
            mkdir -p "$HOME/.local"
            mv nvim-linux-x86_64 "$HOME/.local/nvim"
          fi
          echo "$HOME/.local/nvim/bin" >> "$GITHUB_PATH"

      - name: Install plenary.nvim
        run: |
          if [ ! -d deps/plenary.nvim ]; then
            git clone https://github.com/nvim-lua/plenary.nvim deps/plenary.nvim
            git -C deps/plenary.nvim checkout "$PLENARY_REV"
          fi

      - name: Check Lua syntax
        run: luac5.4 -p lua/mini/codex.lua lua/mini/codex/input.lua plugin/codex.lua tests/minimal_init.lua tests/codex_spec.lua

      - name: Run tests
        run: >-
          nvim --clean --headless -u tests/minimal_init.lua
          -c 'PlenaryBustedFile tests/codex_spec.lua'

  docs:
    name: Generate vimdoc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create vimdoc output directory
        run: mkdir -p doc

      - name: Generate vimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: mini-codex
          description: "Run and resume the Codex CLI from Neovim"
          version: "v1.3.0"
          demojify: true
          treesitter: true

      - name: Generate helptags
        run: vim -Nu NONE -n -es -c "helptags doc/" -c "quit"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            doc/*.txt
            doc/tags
          branch: docs/auto-generate-vimdoc
          delete-branch: true
          commit-message: "docs: auto-generate vimdoc"
          title: "docs: auto-generate vimdoc"
          body: "Regenerate Vim help documentation from README.md."

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
